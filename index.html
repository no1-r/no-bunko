<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>のあーる文庫</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FDFAF6;
      --card-bg:   #F5EFE6;
      --accent:    #C8A47A;
      --accent2:   #E8D5C0;
      --text:      #3D2B1F;
      --sub:       #9E7B5A;
      --divider:   #E2D3C3;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    header {
      text-align: center;
      padding: 64px 24px 48px;
      border-bottom: 1px solid var(--divider);
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 24px auto 0;
    }
    .site-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text);
    }
    .site-subtitle {
      margin-top: 10px;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* ── メインレイアウト ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--sub);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── 小説カード ── */
    .novel-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .novel-card {
      background: var(--card-bg);
      border: 1px solid var(--divider);
      border-radius: 4px;
      padding: 32px 36px;
      cursor: pointer;
      transition: box-shadow 0.25s, border-color 0.25s;
      position: relative;
      overflow: hidden;
    }
    .novel-card::before {
      content: '❧';
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.1rem;
      color: var(--accent2);
    }
    .novel-card:hover {
      box-shadow: 0 4px 20px rgba(200, 164, 122, 0.18);
      border-color: var(--accent);
    }
    .novel-card:hover .novel-title {
      color: var(--accent);
    }

    .novel-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .novel-genre {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: var(--sub);
      background: var(--accent2);
      padding: 2px 10px;
      border-radius: 2px;
    }
    .novel-date {
      font-size: 0.72rem;
      color: var(--sub);
    }

    .novel-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      transition: color 0.2s;
    }
    .novel-synopsis {
      font-size: 0.88rem;
      color: var(--sub);
      line-height: 1.9;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .read-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .novel-card:hover .read-link {
      border-color: var(--accent);
    }

    /* ── 小説詳細ページ (overlay) ── */
    .reader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      overflow-y: auto;
    }
    .reader-overlay.open { display: block; }

    .reader-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 28px 100px;
    }

    .back-btn {
      background: none;
      border: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--sub);
      cursor: pointer;
      padding: 0;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }

    .reader-genre {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--sub);
      background: var(--accent2);
      padding: 2px 10px;
      border-radius: 2px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .reader-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .reader-date {
      font-size: 0.75rem;
      color: var(--sub);
      margin-bottom: 36px;
    }
    .reader-divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin-bottom: 36px;
    }
    .reader-body {
      font-size: 1rem;
      line-height: 2.2;
      color: var(--text);
      white-space: pre-wrap;
    }
    .reader-body p { margin-bottom: 1.6em; }

    /* ── ハートボタン ── */
    .heart-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--divider);
    }
    .heart-btn {
      background: none;
      border: 1.5px solid var(--accent);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sub);
      font-family: 'Noto Sans JP', sans-serif;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .heart-btn:hover {
      background: var(--accent2);
    }
    .heart-btn.liked {
      background: #ffe0ec;
      border-color: #e07090;
      color: #c0385a;
    }
    .heart-btn.pop {
      transform: scale(1.2);
    }
    .heart-count {
      font-size: 0.82rem;
      color: var(--sub);
    }

    /* ── フッター ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid var(--divider);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--sub);
    }

    @media (max-width: 600px) {
      .novel-card { padding: 24px 20px; }
      .reader-inner { padding: 40px 20px 80px; }
    }
  </style>
</head>

　並んで歩く二人の距離は、行きより少しだけ近くなっていた`
      }
    ];
    // =========================================================

    function renderList() {
      const container = document.getElementById('novel-list');
      container.innerHTML = novels.map((n, i) => `
        <article class="novel-card" onclick="openReader(${i})">
          <div class="novel-meta">
            <span class="novel-genre">${n.genre}</span>
            <span class="novel-date">${n.date}</span>
          </div>
          <h2 class="novel-title">${n.title}</h2>
          <p class="novel-synopsis">${n.synopsis}</p>
          <span class="read-link">続きを読む →</span>
        </article>
      `).join('');
    }

    let currentIndex = null;

    function getLikes(index) {
      return parseInt(localStorage.getItem('likes_' + index) || '0');
    }
    function isLiked(index) {
      return localStorage.getItem('liked_' + index) === '1';
    }
    function updateHeartUI(index) {
      const btn = document.getElementById('heart-btn');
      const icon = document.getElementById('heart-icon');
      const count = document.getElementById('heart-count');
      const liked = isLiked(index);
      const likes = getLikes(index);
      btn.classList.toggle('liked', liked);
      icon.textContent = likes > 0 ? '❤️' : '🤍';
      count.textContent = likes > 0 ? likes + ' いいね' : '';
    }
    function toggleHeart() {
      if (currentIndex === null) return;
      const btn = document.getElementById('heart-btn');
      const likes = getLikes(currentIndex);
      localStorage.setItem('likes_' + currentIndex, likes + 1);
      localStorage.setItem('liked_' + currentIndex, '1');
      btn.classList.add('pop');
      setTimeout(() => btn.classList.remove('pop'), 150);
      updateHeartUI(currentIndex);
    }

    function openReader(index) {
      currentIndex = index;
      const n = novels[index];
      document.getElementById('r-genre').textContent = n.genre;
      document.getElementById('r-title').textContent = n.title;
      document.getElementById('r-date').textContent = n.date;
      document.getElementById('r-body').innerHTML =
        n.body.split('\n\n').map(p => `<p>${p}</p>`).join('');
      updateHeartUI(index);
      document.getElementById('reader-overlay').classList.add('open');
      window.scrollTo(0, 0);
    }

    function closeReader() {
      document.getElementById('reader-overlay').classList.remove('open');
      currentIndex = null;
    }

    renderList();
  </script>
</body>
</html>
