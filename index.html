<!DOCTYPE html>
<html lang="ja" data-theme="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>のあーる文庫</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [data-theme="day"] {
      --bg: #FDFAF6; --card-bg: #F5EFE6; --accent: #C8A47A;
      --accent2: #E8D5C0; --text: #3D2B1F; --sub: #9E7B5A; --divider: #E2D3C3;
    }
    [data-theme="night"] {
      --bg: #1a1a2e; --card-bg: #16213e; --accent: #e0a96d;
      --accent2: #2a2a4a; --text: #e8e0d0; --sub: #a89880; --divider: #2e2e4e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ── ヘッダー ── */
    header {
      text-align: center;
      padding: 64px 24px 48px;
      border-bottom: 1px solid var(--divider);
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 24px auto 0;
    }
    .site-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text);
    }
    .site-subtitle {
      margin-top: 10px;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* ── テーマ切り替えボタン ── */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--divider);
      border-radius: 50px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--sub);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* ── メインレイアウト ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }
    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--sub);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── 小説カード ── */
    .novel-list { display: flex; flex-direction: column; gap: 20px; }
    .novel-card {
      background: var(--card-bg);
      border: 1px solid var(--divider);
      border-radius: 4px;
      padding: 32px 36px;
      cursor: pointer;
      transition: box-shadow 0.25s, border-color 0.25s;
      position: relative;
      overflow: hidden;
    }
    .novel-card::before {
      content: '❧';
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.1rem;
      color: var(--accent2);
    }
    .novel-card:hover { box-shadow: 0 4px 20px rgba(200,164,122,0.18); border-color: var(--accent); }
    .novel-card:hover .novel-title { color: var(--accent); }
    .novel-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
    .novel-genre { font-size: 0.68rem; letter-spacing: 0.18em; color: var(--sub); background: var(--accent2); padding: 2px 10px; border-radius: 2px; }
    .novel-date { font-size: 0.72rem; color: var(--sub); }
    .novel-title { font-family: 'Noto Serif JP', serif; font-size: clamp(1.05rem, 2.5vw, 1.25rem); font-weight: 600; letter-spacing: 0.06em; margin-bottom: 14px; transition: color 0.2s; }
    .novel-synopsis { font-size: 0.88rem; color: var(--sub); line-height: 1.9; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .read-link { display: inline-block; margin-top: 18px; font-size: 0.78rem; letter-spacing: 0.2em; color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .novel-card:hover .read-link { border-color: var(--accent); }

    /* ── 読書ページ ── */
    .reader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      overflow-y: auto;
    }
    .reader-overlay.open { display: block; }
    .reader-inner { max-width: 680px; margin: 0 auto; padding: 56px 28px 100px; }

    /* 読書ページのテーマボタン（右上固定） */
    .reader-theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      background: var(--card-bg);
      border: 1px solid var(--divider);
      border-radius: 50px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--sub);
      font-family: 'Noto Sans JP', sans-serif;
      display: none;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .reader-overlay.open ~ .reader-theme-toggle,
    .reader-theme-toggle.visible { display: flex; }
    .reader-theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    .back-btn { background: none; border: none; font-family: 'Noto Sans JP', sans-serif; font-size: 0.78rem; letter-spacing: 0.2em; color: var(--sub); cursor: pointer; padding: 0; margin-bottom: 48px; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
    .back-btn:hover { color: var(--accent); }
    .reader-genre { font-size: 0.68rem; letter-spacing: 0.2em; color: var(--sub); background: var(--accent2); padding: 2px 10px; border-radius: 2px; display: inline-block; margin-bottom: 16px; }
    .reader-title { font-family: 'Noto Serif JP', serif; font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 600; letter-spacing: 0.08em; margin-bottom: 8px; color: var(--text); }
    .reader-date { font-size: 0.75rem; color: var(--sub); margin-bottom: 36px; }
    .reader-divider { width: 40px; height: 1px; background: var(--accent); margin-bottom: 36px; }
    .reader-body { font-size: 1rem; line-height: 2.2; color: var(--text); white-space: pre-wrap; }
    .reader-body p { margin-bottom: 1.6em; }

    /* ── ボタンエリア ── */
    .action-area { display: flex; align-items: center; gap: 12px; margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--divider); flex-wrap: wrap; }
    .heart-btn { background: none; border: 1.5px solid var(--accent); border-radius: 50px; padding: 8px 20px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--sub); font-family: 'Noto Sans JP', sans-serif; transition: background 0.2s, color 0.2s, transform 0.15s; }
    .heart-btn:hover { background: var(--accent2); }
    .heart-btn.liked { background: #ffe0ec; border-color: #e07090; color: #c0385a; }
    .heart-btn.pop, .flower-btn.pop { transform: scale(1.2); }
    .heart-count { font-size: 0.82rem; color: var(--sub); margin-right: 8px; }
    .flower-btn { background: none; border: 1.5px solid #b57fc4; border-radius: 50px; padding: 8px 20px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #8a5a9a; font-family: 'Noto Sans JP', sans-serif; transition: background 0.2s, transform 0.15s; }
    .flower-btn:hover { background: #f3e6f9; }
    .flower-count { font-size: 0.82rem; color: #8a5a9a; }

    /* ── フッター ── */
    footer { text-align: center; padding: 32px 24px; border-top: 1px solid var(--divider); font-size: 0.72rem; letter-spacing: 0.18em; color: var(--sub); }

    @media (max-width: 600px) {
      .novel-card { padding: 24px 20px; }
      .reader-inner { padding: 40px 20px 80px; }
      .theme-toggle .label { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span class="label" id="theme-label">夜モード</span>
    </button>
    <p class="site-subtitle">Novel Collection</p>
    <h1 class="site-title">のあーる文庫</h1>
  </header>

  <main id="list-view">
    <p class="section-label">作品一覧</p>
    <div class="novel-list" id="novel-list"></div>
  </main>

  <div class="reader-overlay" id="reader-overlay">
    <div class="reader-inner">
      <button class="back-btn" onclick="closeReader()">← 一覧に戻る</button>
      <span class="reader-genre" id="r-genre"></span>
      <h2 class="reader-title" id="r-title"></h2>
      <p class="reader-date"><span id="r-date"></span><span id="r-wordcount"></span></p>
      <div class="reader-divider"></div>
      <div class="reader-body" id="r-body"></div>
      <div class="action-area">
        <button class="heart-btn" id="heart-btn" onclick="toggleHeart()">
          <span id="heart-icon">🤍</span><span>いいね</span>
        </button>
        <span class="heart-count" id="heart-count"></span>
        <button class="flower-btn" id="flower-btn" onclick="addFlower()" style="display:none;">
          <span>💐</span><span>花を添える</span>
        </button>
        <span class="flower-count" id="flower-count"></span>
      </div>
      <button class="back-btn" onclick="closeReader()" style="margin-top: 32px;">← 一覧に戻る</button>
    </div>
  </div>

  <!-- 読書ページ用テーマボタン（固定） -->
  <button class="reader-theme-toggle" id="reader-theme-toggle" onclick="toggleTheme()">
    <span id="reader-theme-icon">🌙</span>
    <span id="reader-theme-label">夜モード</span>

        body: `　十月の終わり、夕方の空気は少しだけ冷たくなっていて、吐く息も白くなりそうな季節だった\n\n「ねえ、だからさ。一年記念日くらい、ちょっとくらい会えないの？」\n\n　教室の隅、帰り支度をする生徒たちのざわめきの中で、真奈美は腕を組んだ\n\n　身長は高くない、むしろクラスでも小さい方だ。けれど、そんなことを感じさせないくらい態度は堂々としている\n\n「別に一日中遊ぼうって言ってるわけじゃないし。勉強するなら一緒に勉強したっていいじゃん。私、教えるし」\n\n　目の前の宏昌は、鞄に参考書を詰め込みながら視線を落とした\n\n「……」\n\n「ねえ、聞いてる？」\n\n「聞いてる」\n\n「じゃあ返事」\n\n「……受験近いし」\n\n「だから？」\n\n「だから、今は」\n\n　短い言葉ばかりだった\n\n　真奈美は眉をひそめる\n\n「私と会うの、そんなに嫌？」\n\n「そういうことじゃなくて」\n\n「じゃあ何」\n\n「……。」\n\n「またそれ」\n\n　沈黙\n\n　真奈美は舌打ちを飲み込んだ\n\n「私さ、最近ずっと思ってたんだけど」\n\n　宏昌が顔を上げる\n\n「本当に、私のこと好き？」\n\n　その一言に、宏昌の肩がぴくりと揺れた\n\n「……好きだよ」\n\n「口だけなら何とでも言える」\n\n「違う」\n\n「違わないじゃん、会おうともしてくれないのに」\n\n「……。」\n\n「もういい」\n\n　真奈美は鞄を乱暴に肩へかけた\n\n「宏昌のバカ」\n\n　そう言い捨てて、教室を出た\n\n　追いかけてくる足音はなかった\n\n＿＿＿＿＿＿\n\n　最低\n\n　駅までの道を歩きながら、真奈美は心の中で何度も呟いた\n\n　最低なのは宏昌だ\n\n　いや、もしかしたら自分かもしれない\n\n　でも\n\n（一年記念日だよ？）\n\n　付き合って一年\n\n　長いようで短い時間だった\n\n　嬉しかったことも、喧嘩したことも、全部積み重ねてきた\n\n　だからこそ、不安になる\n\n　好きって言葉だけじゃ足りない日もある\n\n　会いたい\n\n　顔を見たい\n\n　自分だけがそう思っているんじゃないかって、怖くなる\n\n「……萎える」\n\n　ぽつりと呟いて、真奈美は家路についた\n\n＿＿＿＿＿＿\n\n　一方その頃\n\n　宏昌は教室に残っていた\n\n　開いた参考書の文字は、まるで頭に入ってこない\n\n（まただ）\n\n　ペンを握る手に力が入る\n\n　勉強は得意じゃない\n\n　夏までは何とかなると思っていた\n\n　でも秋になって、模試の判定を見て、ようやく現実が見えた\n\n　遅れている\n\n　焦っている\n\n　情けない\n\n　真奈美は頭がいい\n\n　きっと一緒に勉強したら教えてくれる\n\n　でも\n\n（嫌なんだ…）\n\n　分からない問題を前に焦る姿も\n\n　余裕がなくてイライラする姿も\n\n　情けない自分も\n\n　全部見せたくなかった\n\n　真奈美には、格好悪い彼氏でいたくなかった\n\n「……ちゃんと言えばよかった」\n\n　そう呟いた頃には、外はすっかり暗くなっていた\n\n＿＿＿＿＿＿\n\n　家の近くのコンビニ\n\n　自動ドアが開いた瞬間\n\n「あ」\n\n「あ」\n\n　二人の声が重なった\n\n　沈黙\n\n「……。」\n\n「……。」\n\n「……何してんの」\n\n「アイス買いに…」\n\n「私も…」\n\n「……。」\n\n「……。」\n\n　気まずい\n\n　さっきまで喧嘩していた相手と、近所のコンビニで鉢合わせるなんて\n\n　しかもアイス売り場の前で\n\n「それ、いつも食べてるやつじゃん」\n\n「……真奈美こそ」\n\n「何」\n\n「そのアイス…」\n\n「好きだから」\n\n「知ってる」\n\n「……。」\n\n　なんだそれ\n\n　真奈美は少しだけ吹き出しそうになった\n\n＿＿＿＿＿＿\n\n　コンビニの前\n\n　二人で並んでベンチに座る\n\n　秋の夜風は冷たいのに、アイスはちゃんと溶けていく\n\n「……勘違いしないでほしい」\n\n　ぽつりと、宏昌が言った\n\n「え？」\n\n「真奈美と会いたくないわけじゃない」\n\n「じゃあ何」\n\n「……情けないから」\n\n「は？」\n\n「俺、勉強できないし」\n\n　言葉を探すように、ゆっくり続ける\n\n「判定も良くないし、焦ってるし」\n\n「……。」\n\n「真奈美といると安心する。でも、そんな自分見せたくなかった」\n\n　真奈美は黙って聞いていた\n\n「迷惑かけたくないし」\n\n「……。」\n\n「格好悪いって思われたくなくて」\n\n「……。」\n\n「だから、ちゃんと言えなかった」\n\n　沈黙\n\n　コンビニの明かりだけが、二人を照らしていた\n\n「……バカ」\n\n　真奈美は呟く\n\n「早く言ってくれれば…」\n\n　そこまで言って、口を閉じた\n\n　自分だって\n\n　不安ばかりぶつけて\n\n　怒って\n\n　勝手に決めつけた\n\n「私も、ごめん」\n\n「……。」\n\n「会えない＝好きじゃない、って思っちゃった」\n\n「違う」\n\n　即答だった\n\n　宏昌は真奈美を見る\n\n「会えなくても」\n\n　少し照れながら続ける\n\n「俺は真奈美のことが好きだから」\n\n「……。」\n\n「ちゃんと好き」\n\n「……。」\n\n「これからも」\n\n　真奈美は俯いた\n\n「……そういうの」\n\n「うん」\n\n「反則」\n\n「ごめん」\n\n「褒めてるの」\n\n「……そっか」\n\n「あと」\n\n「うん」\n\n「次からはちゃんと言って」\n\n「言う」\n\n「私も怒鳴る前に聞く」\n\n「助かる」\n\n「……。」\n\n「……。」\n\n「……一年記念日」\n\n「うん」\n\n「一時間だけでも…」\n\n「会おう」\n\n「勉強もする？」\n\n「……教えて」\n\n「仕方ないなあ〜」\n\n　真奈美は少しだけ笑った\n\n「ちゃんと教えてあげる」\n\n「お願いします」\n\n「でも、その代わり」\n\n「？」\n\n「アイス奢りね」\n\n「なんで…」\n\n「愛情料」\n\n「高くない？」\n\n「安いでしょ」\n\n　そう言って笑う真奈美は、少しだけ照れていた\n\n　気づけば、二人のアイスはすっかり溶け始めていた\n\n「うわ、やば」\n\n「早く食べなよ」\n\n「真奈美こそ」\n\n「言われなくても〜」\n\n　慌てて食べる二人の姿は、きっと傍から見れば少し間抜けだった\n\n　でも\n\n　好きだから不安になることも\n\n　格好悪い自分を隠したくなることも\n\n　うまく伝えられずにすれ違うことも\n\n　溶けていくアイスに慌てることも\n\n　全部\n\n　きっと\n\n　どうせそれも、愛だから\n\n　コンビニの明かりの下\n\n　並んで歩く二人の距離は、行きより少しだけ近くなっていた`
      }
    ];

    function updateThemeUI() {
      const isNight = document.documentElement.getAttribute('data-theme') === 'night';
      const icon = isNight ? '☀️' : '🌙';
      const label = isNight ? '昼モード' : '夜モード';
      document.getElementById('theme-icon').textContent = icon;
      document.getElementById('theme-label').textContent = label;
      document.getElementById('reader-theme-icon').textContent = icon;
      document.getElementById('reader-theme-label').textContent = label;
    }

    function toggleTheme() {
      const isDay = document.documentElement.getAttribute('data-theme') === 'day';
      document.documentElement.setAttribute('data-theme', isDay ? 'night' : 'day');
      localStorage.setItem('theme', isDay ? 'night' : 'day');
      updateThemeUI();
    }

    function renderList() {
      const container = document.getElementById('novel-list');
      container.innerHTML = novels.map((n, i) => `
        <article class="novel-card" onclick="openReader(${i})">
          <div class="novel-meta">
            <span class="novel-genre">${n.genre}</span>
            <span class="novel-date">${n.date}</span>
            <span class="novel-date">${n.body.replace(/\s/g,'').length.toLocaleString()}文字</span>
          </div>
          <h2 class="novel-title">${n.title}</h2>
          <p class="novel-synopsis">${n.synopsis}</p>
          <span class="read-link">続きを読む →</span>
        </article>
      `).join('');
    }

    let currentIndex = null;

    function getLikes(i) { return parseInt(localStorage.getItem('likes_'+i)||'0'); }
    function isLiked(i) { return localStorage.getItem('liked_'+i)==='1'; }
    function updateHeartUI(i) {
      const likes = getLikes(i);
      document.getElementById('heart-btn').classList.toggle('liked', isLiked(i));
      document.getElementById('heart-icon').textContent = likes > 0 ? '❤️' : '🤍';
      document.getElementById('heart-count').textContent = likes > 0 ? likes+' いいね' : '';
    }
    function toggleHeart() {
      if (currentIndex===null) return;
      localStorage.setItem('likes_'+currentIndex, getLikes(currentIndex)+1);
      localStorage.setItem('liked_'+currentIndex, '1');
      const btn = document.getElementById('heart-btn');
      btn.classList.add('pop');
      setTimeout(()=>btn.classList.remove('pop'),150);
      updateHeartUI(currentIndex);
    }

    function getFlowers(i) { return parseInt(localStorage.getItem('flowers_'+i)||'0'); }
    function updateFlowerUI(i) {
      document.getElementById('flower-count').textContent = getFlowers(i) > 0 ? getFlowers(i)+' 本' : '';
    }
    function addFlower() {
      if (currentIndex===null) return;
      localStorage.setItem('flowers_'+currentIndex, getFlowers(currentIndex)+1);
      const btn = document.getElementById('flower-btn');
      btn.classList.add('pop');
      setTimeout(()=>btn.classList.remove('pop'),150);
      updateFlowerUI(currentIndex);
    }

    function openReader(index) {
      currentIndex = index;
      const n = novels[index];
      document.getElementById('r-genre').textContent = n.genre;
      document.getElementById('r-title').textContent = n.title;
      document.getElementById('r-date').textContent = n.date;
      document.getElementById('r-wordcount').textContent = '　'+n.body.replace(/\s/g,'').length.toLocaleString()+'文字';
      document.getElementById('r-body').innerHTML = n.body.split('\n\n').map(p=>`<p>${p}</p>`).join('');
      updateHeartUI(index);
      const flowerBtn = document.getElementById('flower-btn');
      if (n.flower) {
        flowerBtn.style.display = 'flex';
        updateFlowerUI(index);
      } else {
        flowerBtn.style.display = 'none';
        document.getElementById('flower-count').textContent = '';
      }
      document.getElementById('reader-overlay').classList.add('open');
      document.getElementById('reader-theme-toggle').classList.add('visible');
      window.scrollTo(0,0);
    }

    function closeReader() {
      document.getElementById('reader-overlay').classList.remove('open');
      document.getElementById('reader-theme-toggle').classList.remove('visible');
      currentIndex = null;
    }

    // 保存済みテーマを復元
    const savedTheme = localStorage.getItem('theme') || 'day';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeUI();

    renderList();
  </script>
</body>
</html>
