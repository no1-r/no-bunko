<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>のあーる文庫</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FDFAF6;
      --card-bg:   #F5EFE6;
      --accent:    #C8A47A;
      --accent2:   #E8D5C0;
      --text:      #3D2B1F;
      --sub:       #9E7B5A;
      --divider:   #E2D3C3;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    header {
      text-align: center;
      padding: 64px 24px 48px;
      border-bottom: 1px solid var(--divider);
      position: relative;
    }
    header::after {
      content: '';
      display: block;
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 24px auto 0;
    }
    .site-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--text);
    }
    .site-subtitle {
      margin-top: 10px;
      font-size: 0.82rem;
      letter-spacing: 0.22em;
      color: var(--sub);
      text-transform: uppercase;
    }

    /* ── メインレイアウト ── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }

    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      color: var(--sub);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── 小説カード ── */
    .novel-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .novel-card {
      background: var(--card-bg);
      border: 1px solid var(--divider);
      border-radius: 4px;
      padding: 32px 36px;
      cursor: pointer;
      transition: box-shadow 0.25s, border-color 0.25s;
      position: relative;
      overflow: hidden;
    }
    .novel-card::before {
      content: '❧';
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.1rem;
      color: var(--accent2);
    }
    .novel-card:hover {
      box-shadow: 0 4px 20px rgba(200, 164, 122, 0.18);
      border-color: var(--accent);
    }
    .novel-card:hover .novel-title {
      color: var(--accent);
    }

    .novel-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .novel-genre {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: var(--sub);
      background: var(--accent2);
      padding: 2px 10px;
      border-radius: 2px;
    }
    .novel-date {
      font-size: 0.72rem;
      color: var(--sub);
    }

    .novel-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 600;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      transition: color 0.2s;
    }
    .novel-synopsis {
      font-size: 0.88rem;
      color: var(--sub);
      line-height: 1.9;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .read-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .novel-card:hover .read-link {
      border-color: var(--accent);
    }

    /* ── 小説詳細ページ (overlay) ── */
    .reader-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      overflow-y: auto;
    }
    .reader-overlay.open { display: block; }

    .reader-inner {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 28px 100px;
    }

    .back-btn {
      background: none;
      border: none;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--sub);
      cursor: pointer;
      padding: 0;
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: var(--accent); }

    .reader-genre {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--sub);
      background: var(--accent2);
      padding: 2px 10px;
      border-radius: 2px;
      display: inline-block;
      margin-bottom: 16px;
    }
    .reader-title {
      font-family: 'Noto Serif JP', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .reader-date {
      font-size: 0.75rem;
      color: var(--sub);
      margin-bottom: 36px;
    }
    .reader-divider {
      width: 40px;
      height: 1px;
      background: var(--accent);
      margin-bottom: 36px;
    }
    .reader-body {
      font-size: 1rem;
      line-height: 2.2;
      color: var(--text);
      white-space: pre-wrap;
    }
    .reader-body p { margin-bottom: 1.6em; }

    /* ── ハートボタン ── */
    .heart-area {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--divider);
    }
    .heart-btn {
      background: none;
      border: 1.5px solid var(--accent);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--sub);
      font-family: 'Noto Sans JP', sans-serif;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .heart-btn:hover {
      background: var(--accent2);
    }
    .heart-btn.liked {
      background: #ffe0ec;
      border-color: #e07090;
      color: #c0385a;
    }
    .heart-btn.pop {
      transform: scale(1.2);
    }
    .heart-count {
      font-size: 0.82rem;
      color: var(--sub);
    }

    /* ── フッター ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid var(--divider);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--sub);
    }

    @media (max-width: 600px) {
      .novel-card { padding: 24px 20px; }
      .reader-inner { padding: 40px 20px 80px; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <p class="site-subtitle">Novel Collection</p>
    <h1 class="site-title">のあーる文庫</h1>
  </header>

  <!-- 小説一覧 -->
  <main id="list-view">
    <p class="section-label">作品一覧</p>
    <div class="novel-list" id="novel-list"></div>
  </main>

  <!-- 読書ページ (overlay) -->
  <div class="reader-overlay" id="reader-overlay">
    <div class="reader-inner">
      <button class="back-btn" onclick="closeReader()">← 一覧に戻る</button>
      <span class="reader-genre" id="r-genre"></span>
      <h2 class="reader-title" id="r-title"></h2>
      <p class="reader-date" id="r-date"></p>
      <div class="reader-divider"></div>
      <div class="reader-body" id="r-body"></div>
      <div class="heart-area">
        <button class="heart-btn" id="heart-btn" onclick="toggleHeart()">
          <span id="heart-icon">🤍</span>
          <span>いいね</span>
        </button>
        <span class="heart-count" id="heart-count"></span>
      </div>
      <button class="back-btn" onclick="closeReader()" style="margin-top: 32px;">← 一覧に戻る</button>
    </div>
  </div>

  <footer>
    &copy; 2026 のあーる文庫 ― 掲載されている作品の権利は、著作者に帰属します
  </footer>

  <script>
    // =========================================================
    // 📖 ここに小説データを追加してください
    // =========================================================
    const novels = [
      {
        title: "どうせそれも愛だから。",
        genre: "恋愛",
        date: "2026年6月12日",
        synopsis: "受験を前にすれ違う高校生カップル。会えない不安と伝えられない本音の先で、二人はコンビニの片隅で「愛」の形を知っていく。",
        body: `　十月の終わり、夕方の空気は少しだけ冷たくなっていて、吐く息も白くなりそうな季節だった

「ねえ、だからさ。一年記念日くらい、ちょっとくらい会えないの？」

　教室の隅、帰り支度をする生徒たちのざわめきの中で、真奈美は腕を組んだ

　身長は高くない、むしろクラスでも小さい方だ。けれど、そんなことを感じさせないくらい態度は堂々としている

「別に一日中遊ぼうって言ってるわけじゃないし。勉強するなら一緒に勉強したっていいじゃん。私、教えるし」

　目の前の宏昌は、鞄に参考書を詰め込みながら視線を落とした

「……」

「ねえ、聞いてる？」

「聞いてる」

「じゃあ返事」

「……受験近いし」

「だから？」

「だから、今は」

　短い言葉ばかりだった

　真奈美は眉をひそめる

「私と会うの、そんなに嫌？」

「そういうことじゃなくて」

「じゃあ何」

「……。」

「またそれ」

　沈黙

　真奈美は舌打ちを飲み込んだ

「私さ、最近ずっと思ってたんだけど」

　宏昌が顔を上げる

「本当に、私のこと好き？」

　その一言に、宏昌の肩がぴくりと揺れた

「……好きだよ」

「口だけなら何とでも言える」

「違う」

「違わないじゃん、会おうともしてくれないのに」

「……。」

「もういい」

　真奈美は鞄を乱暴に肩へかけた

「宏昌のバカ」

　そう言い捨てて、教室を出た

　追いかけてくる足音はなかった

＿＿＿＿＿＿

　最低

　駅までの道を歩きながら、真奈美は心の中で何度も呟いた

　最低なのは宏昌だ

　いや、もしかしたら自分かもしれない

　でも

（一年記念日だよ？）

　付き合って一年

　長いようで短い時間だった

　嬉しかったことも、喧嘩したことも、全部積み重ねてきた

　だからこそ、不安になる

　好きって言葉だけじゃ足りない日もある

　会いたい

　顔を見たい

　自分だけがそう思っているんじゃないかって、怖くなる

「……萎える」

　ぽつりと呟いて、真奈美は家路についた

＿＿＿＿＿＿

　一方その頃

　宏昌は教室に残っていた

　開いた参考書の文字は、まるで頭に入ってこない

（まただ）

　ペンを握る手に力が入る

　勉強は得意じゃない

　夏までは何とかなると思っていた

　でも秋になって、模試の判定を見て、ようやく現実が見えた

　遅れている

　焦っている

　情けない

　真奈美は頭がいい

　きっと一緒に勉強したら教えてくれる

　でも

（嫌なんだ…）

　分からない問題を前に焦る姿も

　余裕がなくてイライラする姿も

　情けない自分も

　全部見せたくなかった

　真奈美には、格好悪い彼氏でいたくなかった

「……ちゃんと言えばよかった」

　そう呟いた頃には、外はすっかり暗くなっていた

＿＿＿＿＿＿

　家の近くのコンビニ

　自動ドアが開いた瞬間

「あ」

「あ」

　二人の声が重なった

　沈黙

「……。」

「……。」

「……何してんの」

「アイス買いに…」

「私も…」

「……。」

「……。」

　気まずい

　さっきまで喧嘩していた相手と、近所のコンビニで鉢合わせるなんて

　しかもアイス売り場の前で

「それ、いつも食べてるやつじゃん」

「……真奈美こそ」

「何」

「そのアイス…」

「好きだから」

「知ってる」

「……。」

　なんだそれ

　真奈美は少しだけ吹き出しそうになった

＿＿＿＿＿＿

　コンビニの前

　二人で並んでベンチに座る

　秋の夜風は冷たいのに、アイスはちゃんと溶けていく

「……勘違いしないでほしい」

　ぽつりと、宏昌が言った

「え？」

「真奈美と会いたくないわけじゃない」

「じゃあ何」

「……情けないから」

「は？」

「俺、勉強できないし」

　言葉を探すように、ゆっくり続ける

「判定も良くないし、焦ってるし」

「……。」

「真奈美といると安心する。でも、そんな自分見せたくなかった」

　真奈美は黙って聞いていた

「迷惑かけたくないし」

「……。」

「格好悪いって思われたくなくて」

「……。」

「だから、ちゃんと言えなかった」

　沈黙

　コンビニの明かりだけが、二人を照らしていた

「……バカ」

　真奈美は呟く

「早く言ってくれれば…」

　そこまで言って、口を閉じた

　自分だって

　不安ばかりぶつけて

　怒って

　勝手に決めつけた

「私も、ごめん」

「……。」

「会えない＝好きじゃない、って思っちゃった」

「違う」

　即答だった

　宏昌は真奈美を見る

「会えなくても」

　少し照れながら続ける

「俺は真奈美のことが好きだから」

「……。」

「ちゃんと好き」

「……。」

「これからも」

　真奈美は俯いた

「……そういうの」

「うん」

「反則」

「ごめん」

「褒めてるの」

「……そっか」

「あと」

「うん」

「次からはちゃんと言って」

「言う」

「私も怒鳴る前に聞く」

「助かる」

「……。」

「……。」

「……一年記念日」

「うん」

「一時間だけでも…」

「会おう」

「勉強もする？」

「……教えて」

「仕方ないなあ〜」

　真奈美は少しだけ笑った

「ちゃんと教えてあげる」

「お願いします」

「でも、その代わり」

「？」

「アイス奢りね」

「なんで…」

「愛情料」

「高くない？」

「安いでしょ」

　そう言って笑う真奈美は、少しだけ照れていた

　気づけば、二人のアイスはすっかり溶け始めていた

「うわ、やば」

「早く食べなよ」

「真奈美こそ」

「言われなくても〜」

　慌てて食べる二人の姿は、きっと傍から見れば少し間抜けだった

　でも

　好きだから不安になることも

　格好悪い自分を隠したくなることも

　うまく伝えられずにすれ違うことも

　溶けていくアイスに慌てることも

　全部

　きっと

　どうせそれも、愛だから

　コンビニの明かりの下

　並んで歩く二人の距離は、行きより少しだけ近くなっていた`
      }
    ];
    // =========================================================

    function renderList() {
      const container = document.getElementById('novel-list');
      container.innerHTML = novels.map((n, i) => `
        <article class="novel-card" onclick="openReader(${i})">
          <div class="novel-meta">
            <span class="novel-genre">${n.genre}</span>
            <span class="novel-date">${n.date}</span>
          </div>
          <h2 class="novel-title">${n.title}</h2>
          <p class="novel-synopsis">${n.synopsis}</p>
          <span class="read-link">続きを読む →</span>
        </article>
      `).join('');
    }

    let currentIndex = null;

    function getLikes(index) {
      return parseInt(localStorage.getItem('likes_' + index) || '0');
    }
    function isLiked(index) {
      return localStorage.getItem('liked_' + index) === '1';
    }
    function updateHeartUI(index) {
      const btn = document.getElementById('heart-btn');
      const icon = document.getElementById('heart-icon');
      const count = document.getElementById('heart-count');
      const liked = isLiked(index);
      const likes = getLikes(index);
      btn.classList.toggle('liked', liked);
      icon.textContent = likes > 0 ? '❤️' : '🤍';
      count.textContent = likes > 0 ? likes + ' いいね' : '';
    }
    function toggleHeart() {
      if (currentIndex === null) return;
      const btn = document.getElementById('heart-btn');
      const likes = getLikes(currentIndex);
      localStorage.setItem('likes_' + currentIndex, likes + 1);
      localStorage.setItem('liked_' + currentIndex, '1');
      btn.classList.add('pop');
      setTimeout(() => btn.classList.remove('pop'), 150);
      updateHeartUI(currentIndex);
    }

    function openReader(index) {
      currentIndex = index;
      const n = novels[index];
      document.getElementById('r-genre').textContent = n.genre;
      document.getElementById('r-title').textContent = n.title;
      document.getElementById('r-date').textContent = n.date;
      document.getElementById('r-body').innerHTML =
        n.body.split('\n\n').map(p => `<p>${p}</p>`).join('');
      updateHeartUI(index);
      document.getElementById('reader-overlay').classList.add('open');
      window.scrollTo(0, 0);
    }

    function closeReader() {
      document.getElementById('reader-overlay').classList.remove('open');
      currentIndex = null;
    }

    renderList();
  </script>
</body>
</html>
